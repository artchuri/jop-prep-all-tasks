spring:
  application:
    name: job-prep
  datasource:
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  jooq:
    sql-dialect: POSTGRES
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
  # Test containers do not provide MongoDB; JobRunr's storage autoconfiguration
  # would otherwise abort the whole test context (it demands a uuidRepresentation).
  autoconfigure:
    exclude:
      # Test containers provide only PostgreSQL/Redis/Kafka; everything else below
      # needs external infrastructure (MongoDB, S3, Eureka, Elasticsearch) or a
      # configured cloud account, and aborts the whole test context otherwise.
      - org.jobrunr.spring.autoconfigure.storage.JobRunrMongoDBStorageAutoConfiguration
      - org.springframework.ai.vectorstore.s3.autoconfigure.S3VectorStoreAutoConfiguration
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration

outbox:
  publisher:
    enabled: true

rate-limit:
  enabled: false
  outage-strategy: reject
  path-prefix: /v1
  window-ms: 60000
  default-limit-per-minute: 600
  outage-retry-after-seconds: 30
  pool-max-active: 16
  pool-max-idle: 8
  pool-min-idle: 2
  pool-command-timeout-ms: 25
  clients:
    - name: test-client
      api-key: test-client-key
  endpoints:
    - id: get-account
      method: GET
      pattern: "/v1/account/*"
      limit-per-minute: 6000
    - id: freeze
      method: POST
      pattern: "/v1/account/*/freeze"
      limit-per-minute: 600
    - id: transfer
      method: POST
      pattern: "/v1/transfer"
      limit-per-minute: 1200
  peak-profiles: []
