spring:
  application:
    name: job-prep
  datasource:
    # URL/credentials are injected dynamically by Testcontainers (@ServiceConnection / @DynamicPropertySource)
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  jooq:
    sql-dialect: POSTGRES
