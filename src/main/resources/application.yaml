spring:
  application:
    name: job-prep

  datasource:
    url: jdbc:postgresql://localhost:5432/job_prep
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 250
      minimum-idle: 10
      connection-timeout: 3000
      pool-name: job-prep-pg-pool

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  jooq:
    sql-dialect: POSTGRES

  data:
    redis:
      client-type: jedis
      host: localhost
      port: 6379
      timeout: 100ms
      connect-timeout: 500ms
      jedis:
        pool:
          enabled: true
          max-active: 64
          max-idle: 16
          min-idle: 4
          max-wait: 100ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 2
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    consumer:
      group-id: account-cache-invalidation
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual


account-cache:
  ttl-ms: 60000
  ttl-jitter-ms: 9000
  lease-ms: 800
  margin-ms: 400
  stale-ms: 5000


resilience4j:
  circuitbreaker:
    instances:
      outbox-kafka:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true

management:
  health:
    redis:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus

rate-limit:
  enabled: true
  outage-strategy: reject
  path-prefix: /v1
  window-ms: 60000
  default-limit-per-minute: 600
  outage-retry-after-seconds: 30
  pool-max-active: 16
  pool-max-idle: 8
  pool-min-idle: 2
  pool-command-timeout-ms: 25
  clients:
    - name: local
      api-key: ${RATE_LIMIT_CLIENT_1_API_KEY}
  endpoints:
    - id: get-account
      method: GET
      pattern: "/v1/account/*"
      limit-per-minute: 6000
    - id: freeze
      method: POST
      pattern: "/v1/account/*/freeze"
      limit-per-minute: 600
    - id: transfer
      method: POST
      pattern: "/v1/transfer"
      limit-per-minute: 1200
  peak-profiles: []
