services:
  postgres:
    image: postgres:17-alpine
    container_name: job-prep-postgres
    environment:
      POSTGRES_DB: job_prep
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_prep -d job_prep"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
